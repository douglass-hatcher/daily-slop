
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Slop or No Slop?</title>
<meta property="og:title" content="Today's Slop or No Slop?">
<meta property="og:description" content="One phrase. One day. You decide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #F2EFE8;
    --crimson: #B8213A;
    --ink:     #1A1A1A;
    --charcoal:#3D3D3D;
    --mid:     #6B6660;
    --rule:    #D4CFC8;
    --oat:     #E4DDD0;
    --green:   #2A5C3F;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
  }

  /* MASTHEAD */
  .masthead {
    text-align: center;
    padding: 32px 24px 0;
    flex-shrink: 0;
  }

  .masthead-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .masthead-title .black { color: var(--ink); }
  .masthead-title .red   { color: var(--crimson); font-style: italic; }

  .masthead-date {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
    margin-top: 10px;
  }

  .masthead-rule {
    width: 100%;
    height: 1px;
    background: var(--ink);
    margin-top: 16px;
    opacity: 0.15;
  }

  /* STAGE */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
  }

  .phrase {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 5vw, 44px);
    font-weight: 900;
    line-height: 1.25;
    text-align: center;
    color: var(--charcoal);
    white-space: pre-line;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .phrase.visible { opacity: 1; transform: translateY(0); }

  /* VOTED STATE */
  .result-view {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    gap: 0;
    text-align: center;
  }

  .result-phrase {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 32px;
    line-height: 1.3;
  }

  .result-divider { width: 100%; height: 1px; background: var(--rule); }

  .result-row {
    width: 100%;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .pct-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(44px, 10vw, 64px);
    font-weight: 900;
    line-height: 1;
  }

  .result-view.slop  .result-row:first-of-type .pct-number { color: var(--crimson); }
  .result-view.good  .result-row:last-of-type  .pct-number { color: var(--green); }

  .pct-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mid);
  }

  .come-back {
    margin-top: 28px;
    font-size: 12px;
    color: var(--mid);
    letter-spacing: 0.05em;
  }

  .come-back strong { color: var(--charcoal); }

  /* BUTTONS */
  .btns {
    display: flex;
    align-items: stretch;
    width: calc(100% - 40px);
    margin: 0 20px 32px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 3s ease, transform 3s ease;
  }

  .btns.visible { opacity: 1; transform: translateY(0); }
  .btns.instant { transition: none; }

  .btn {
    flex: 1;
    border: none;
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 28px);
    font-weight: 900;
    padding: 24px 12px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: filter 0.15s;
  }

  .btn:hover  { filter: brightness(0.92); }
  .btn:active { filter: brightness(0.82); }
  .btn:disabled { opacity: 0.3; cursor: default; filter: none; }

  .btn-slop { background: var(--crimson); color: white; }
  .btn-no   { background: var(--oat); color: var(--ink); border-left: 1px solid var(--rule); }

  .btn-or {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--mid);
    padding: 0 12px;
    flex-shrink: 0;
    letter-spacing: 0.14em;
    display: flex;
    align-items: center;
    background: var(--bg);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--rule);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .footer-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mid);
  }

  .footer-miss {
    font-size: 10px;
    color: var(--mid);
  }

  .footer-miss a { color: var(--crimson); text-decoration: none; }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-title">
    <span class="black">Today's Slop or No </span><span class="red">Slop?</span>
  </div>
  <div class="masthead-date" id="dateLabel"></div>
  <div class="masthead-rule"></div>
</div>

<div class="stage" id="stage">
  <div class="phrase" id="phrase"></div>
</div>

<div class="result-view" id="resultView">
  <div class="result-phrase" id="resultPhrase"></div>
  <div class="result-divider"></div>
  <div class="result-row">
    <div class="pct-number" id="pctSlop">—</div>
    <div class="pct-label">say it's slop</div>
  </div>
  <div class="result-divider"></div>
  <div class="result-row">
    <div class="pct-number" id="pctNo">—</div>
    <div class="pct-label">say it's not</div>
  </div>
  <div class="result-divider"></div>
  <div class="come-back">Come back tomorrow for a new phrase.</div>
</div>

<div class="btns" id="btns">
  <button class="btn btn-slop" id="btnSlop" onclick="vote('slop')">Slop</button>
  <span class="btn-or">or</span>
  <button class="btn btn-no"   id="btnNo"   onclick="vote('no')">No Slop</button>
</div>

<footer>
  <span class="footer-tag">Think Well. Write Well. Lead Well.™</span>
  <span class="footer-miss">What did we miss? <a href="mailto:douglass@communicate4impact.com">Tell us.</a></span>
</footer>

<script>
const PHRASES = [
  { phrase: "What nobody tells you.",                          key: "what_nobody_tells_you" },
  { phrase: "It's not X.\nIt's Y.",                           key: "its_not_x_its_y" },
  { phrase: "Let that sink in.",                               key: "let_that_sink_in" },
  { phrase: "This changed everything.",                        key: "this_changed_everything" },
  { phrase: "The unlock is.",                                  key: "the_unlock_is" },
  { phrase: "Here's something\nI've been sitting with.",       key: "sitting_with" },
  { phrase: "Your question has stayed with me\nsince you first brought it up.", key: "stayed_with_me" },
  { phrase: "The real work is.",                               key: "the_real_work_is" },
  { phrase: "Intentionality.",                                 key: "intentionality" },
  { phrase: "The truth nobody\nwants to hear.",                key: "the_truth_nobody_wants_to_hear" },
  { phrase: "Most people think X.\nThe best ones do Y.",       key: "most_people_think_x" },
  { phrase: "Here's the thing.",                               key: "heres_the_thing" },
  { phrase: "We need to talk about.",                          key: "we_need_to_talk_about" },
  { phrase: "The shift is happening.",                         key: "the_shift_is_happening" },
  { phrase: "I've been thinking\na lot about.",                key: "ive_been_thinking_a_lot_about" },
  { phrase: "The answer is simpler\nthan you think.",          key: "the_answer_is_simpler" },
  { phrase: "As we navigate the\nrapidly changing landscape.", key: "as_we_navigate" },
  { phrase: "Earns its place.",                                key: "earns_its_place" },
  { phrase: "That's an issue you've been\ncircling for quite some time.", key: "the_issue_youre_circling" },
];

// Date string for today
function getDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Format date for display
function formatDate(str) {
  const [y,m,d] = str.split('-');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `Today · ${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
}

// Pick today's phrase deterministically by date
function getTodaysPhrase(dateStr) {
  const parts = dateStr.split('-').map(Number);
  const seed = parts[0] * 10000 + parts[1] * 100 + parts[2];
  return PHRASES[seed % PHRASES.length];
}

const TODAY = getDateStr();
const ITEM  = getTodaysPhrase(TODAY);
const VOTED_KEY = `daily_voted_${TODAY}`;

// Check if already voted today
const alreadyVoted = localStorage.getItem(VOTED_KEY);

// Set date label
document.getElementById('dateLabel').textContent = formatDate(TODAY);

// Show phrase
const phraseEl = document.getElementById('phrase');
phraseEl.textContent = ITEM.phrase;
setTimeout(() => phraseEl.classList.add('visible'), 100);

if (alreadyVoted) {
  // Show result immediately
  showResultView(alreadyVoted);
  loadVotes();
} else {
  // Show buttons after 3s sloth fade
  const btnsEl = document.getElementById('btns');
  setTimeout(() => btnsEl.classList.add('visible'), 3000);
}

async function vote(choice) {
  localStorage.setItem(VOTED_KEY, choice);
  ['btnSlop','btnNo'].forEach(id => document.getElementById(id).disabled = true);

  showResultView(choice);

  try {
    const resp = await fetch('/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: TODAY, key: ITEM.key, vote: choice })
    });
    const data = await resp.json();
    updatePcts(data);
  } catch(e) {}
}

function showResultView(choice) {
  document.getElementById('stage').style.display = 'none';
  const btnsEl = document.getElementById('btns');
  btnsEl.classList.add('instant');
  btnsEl.style.display = 'none';

  const rv = document.getElementById('resultView');
  rv.style.display = 'flex';
  rv.className = 'result-view ' + (choice === 'slop' ? 'slop' : 'good');
  document.getElementById('resultPhrase').textContent = ITEM.phrase.replace(/\n/g,' ');
}

async function loadVotes() {
  try {
    const resp = await fetch(`/api/vote?date=${TODAY}&key=${ITEM.key}`);
    const data = await resp.json();
    updatePcts(data);
  } catch(e) {}
}

function updatePcts(data) {
  const total = data.total || 0;
  if (total === 0) return;
  const slopPct = Math.round((data.slop / total) * 100);
  document.getElementById('pctSlop').textContent = slopPct + '%';
  document.getElementById('pctNo').textContent   = (100 - slopPct) + '%';
}

// Swipe
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(alreadyVoted||localStorage.getItem(VOTED_KEY)) return;
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return;
  vote(dx<0?'slop':'no');
},{passive:true});
</script>
</body>
</html>
